<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="icon" type="image/x-icon" href="img/facebook_logo_icon.svg"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <table class="tabela">
        <tr class="linha-um">
            <!-- INFORMAÇÕES DO LADO ESQUERDO -->
            <td class="lado-esquerdo">
                <img 
                    src="img/facebook_logo_icon.svg"
                    alt="Ícone do Facebook"
                    id="imagemIcone"
                />

                <img 
                    src="img/imagem_ilustrativa.png"
                    alt="Imagem ilustrativa de publicações no Facebook"
                    id="imagemIlustrativa"
                />

                <div class="frase">
                    <span>Explore <br/> as coisas <br/> que</span>
                    <span id="destaque2">você <br/> ama</span>
                    <span id="destaque3">.</span>
                </div>
            </td>
            <!-- INFORMAÇÕES DO LADO DIREITO-->
            <td class="lado-direito">
                <span id="frase-login">Entrar no Facebook</span>

                <div class="campos">
                    <div>
                        <input type="text" placeholder="Email ou número de celular"/>
                        <input type="text" placeholder="Senha"/>
                    </div>
                    <div>
                        <button>Entrar</button>
                        <button>Esqueceu a senha?</button>
                        <button>Criar nova conta</button>
                    </div>
                </div>
            </td>
        </tr>

        <!-- INFORMAÇÕES DE IDIOMAS-->
        <tr class="linha-dois">
            <td id="idiomas" colspan="2">A</td>
        </tr>
    </table>
</body>
</html>
