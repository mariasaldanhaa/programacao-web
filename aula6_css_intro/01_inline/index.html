<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Stryles inline e da página</title>
        <style>
            .titulo {
                color: brown;
                font-size: 30px;
            }
            .texto {
                color: gray;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <p class="titulo">Título do meu documento</p>
        <p class="texto">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Temporibus omnis doloribus 
            aspernatur distinctio ratione tempora ut iste recusandae totam rem rerum doloremque 
            illo enim, similique quidem excepturi repellat exercitationem magnam!
        </p>
        <p style="color: blue; font-weight: bold; text-decoration: underline">PARÁGRAFO</p>
    </body>
