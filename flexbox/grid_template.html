<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>:: GRID TEMPLATE</title>
        <style>
            body {
                margin: 0;
                padding: 0;
            }

            section {
                display: grid;
                height: 100vh;

                /* tabela 3x4 */
                grid-template-columns: repeat(3, 1fr); /* divide a area em 3 espaços e cada um com 1fr*/
                grid-template-rows: repeat(4, 1fr);
                

                grid-template-areas: 
                "header header header"
                "nav nav nav"
                "menu content content"
                "footer footer footer";
            }

            .banner {
                grid-area: header;
                background-color: red;
                text-align: center;
            }

            .barra {
                grid-area: nav;
                background-color: yellow;
                text-align: center;
            }

            .menu {
                background-color: blue;
                text-align: center;
            }

            .conteudo {
                grid-area: content;
                background-color: green;
                text-align: center;
            }

            .rodape {
                grid-area: footer;
                background-color: brown;
                text-align: center;
            }

            

            div {
                font-size: 30px;
                font-weight: bold;
                box-shadow: inset 0 0 1px black;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <section>
            <div class="banner">Banner</div>
            <div class="barra">Barra</div>
            <div class="menu">Menu</div>
            <div class="conteudo">Conteúdo</div>
            <div class="rodape">Rodapé</div>
        </section>
    </body>
